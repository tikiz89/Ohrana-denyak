              ) { padding ->
                  Column(modifier = Modifier.fillMaxSize().background(Color(0xFF0F1115)).padding(padding)) {
                      if (!isListenerEnabled) {
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 6.dp).clickable { context.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) },
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF3E2723)), shape = RoundedCornerShape(14.dp)
