                                  val m = merchantText.ifBlank { "Покупка" }
                                  dbHelper.insertExpense(amt, m, ZenCategory.detectCategory(m, m).title, "Вручную")
                                  showAddDialog = false; onForceRefresh()
                              }
                          }) { Text("Сохранить") }
                      }
                  )
              }

              if (showBudgetDialog) {
                  var text by remember { mutableStateOf(budget.toInt().toString()) }
                  AlertDialog(
                      onDismissRequest = { showBudgetDialog = false },
                      containerColor = Color(0xFF1A1D24),
                      title = { Text("Лимит на месяц", color = Color.White) },
                      text = { OutlinedTextField(value = text, onValueChange = { text = it }, label = { Text("Сумма ₽") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number)) },
                      confirmButton = {
                          Button(onClick = {
                              val v = text.toDoubleOrNull() ?: budget
                              if (v > 0) { dbHelper.setMonthlyBudget(v); showBudgetDialog = false; onForceRefresh() }
                          }) { Text("Сохранить") }
                      }
                  )
              }
          }

          @Composable
          fun AnalyticsTab(expenses: List<ExpenseItem>, budget: Double, onEditBudget: () -> Unit) {
              val onlyExp = expenses.filter { !it.isIncome }
              val totalSpent = onlyExp.sumOf { it.amount }
              val byCategory = onlyExp.groupBy { it.category }.mapValues { it.value.sumOf { x -> x.amount } }.toList().sortedByDescending { it.second }

              LazyColumn(modifier = Modifier.fillMaxSize(), contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1D24)), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(contentAlignment = Alignment.Center, modifier = Modifier.size(200.dp)) {
                                  val anim by animateFloatAsState(1f, tween(600), label = "")
                                  Canvas(modifier = Modifier.size(180.dp)) {
                                      val sw = 24.dp.toPx()
                                      if (totalSpent <= 0.0) {
                                          drawArc(Color(0xFF2C313C), 0f, 360f, false, style = Stroke(sw, cap = StrokeCap.Round))
                                      } else {
                                          var start = -90f
                                          byCategory.forEach { (cat, amt) ->
                                              val sweep = ((amt / totalSpent).toFloat() * 360f) * anim
                                              drawArc(Color(ZenCategory.fromTitle(cat).colorHex), start, sweep, false, style = Stroke(sw, cap = StrokeCap.Butt))
                                              start += sweep
                                          }
                                      }
                                  }
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Text("Расход за месяц", color = Color.Gray, fontSize = 12.sp)
                                      Text(formatRub(totalSpent), color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.ExtraBold)
                                  }
                              }
                              Spacer(Modifier.height(16.dp))
                              val progress = if (budget > 0) (totalSpent / budget).toFloat().coerceIn(0f, 1f) else 0f
                              Row(modifier = Modifier.fillMaxWidth().clickable { onEditBudget() }, horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("Лимит: ${formatRub(budget)}", color = Color.LightGray, fontSize = 13.sp)
                                  Text("Остаток: ${formatRub((budget - totalSpent).coerceAtLeast(0.0))}", color = Color(0xFF00E676), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(Modifier.height(8.dp))
                              LinearProgressIndicator(progress = progress, modifier = Modifier.fillMaxWidth().height(8.dp).clip(RoundedCornerShape(4.dp)), color = if (progress < 0.85f) Color(0xFF00E676) else Color(0xFFFF5252), trackColor = Color(0xFF2C313C))
                          }
                      }
                  }
                  items(byCategory) { (catName, amount) ->
                      val cat = ZenCategory.fromTitle(catName)
                      val pct = if (totalSpent > 0) ((amount / totalSpent) * 100).toInt() else 0
                      Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1D24)), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                          Row(modifier = Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                              Box(modifier = Modifier.size(40.dp).clip(CircleShape).background(Color(cat.colorHex).copy(alpha = 0.2f)), contentAlignment = Alignment.Center) { Text(cat.emoji, fontSize = 20.sp) }
                              Spacer(Modifier.width(12.dp))
                              Column(Modifier.weight(1f)) {
                                  Text(catName, color = Color.White, fontWeight = FontWeight.SemiBold)
                                  Text("$pct% от всех трат", color = Color.Gray, fontSize = 12.sp)
                              }
                              Text(formatRub(amount), color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }

          @Composable
          fun TransactionsTab(expenses: List<ExpenseItem>, onDelete: (Long) -> Unit) {
              val sdf = remember { SimpleDateFormat("dd MMM, HH:mm", Locale("ru")) }
              LazyColumn(modifier = Modifier.fillMaxSize(), contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(expenses, key = { it.id }) { item ->
                      val cat = ZenCategory.fromTitle(item.category)
                      Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1D24)), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                          Row(modifier = Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                              Text(cat.emoji, fontSize = 22.sp)
                              Spacer(Modifier.width(12.dp))
                              Column(Modifier.weight(1f)) {
                                  Text(item.merchant, color = Color.White, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text("${item.category} • ${item.bank} • ${sdf.format(Date(item.timestamp))}", color = Color.Gray, fontSize = 12.sp)
                              }
                              Text("-${formatRub(item.amount)}", color = Color.White, fontWeight = FontWeight.Bold)
                              IconButton(onClick = { onDelete(item.id) }) { Icon(Icons.Default.DeleteOutline, null, tint = Color.Gray) }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SimulatorTab(enabled: Boolean, onOpenSettings: () -> Unit, onSim: (Double, String, String) -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Button(onClick = onOpenSettings, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E676), contentColor = Color.Black)) {
                      Text(if (enabled) "Авточтение активно (Настройки)" else "Включить авточтение пушей", fontWeight = FontWeight.Bold)
                  }
                  OutlinedButton(onClick = { onSim(1850.0, "Пятёрочка", "Сбербанк") }, modifier = Modifier.fillMaxWidth()) { Text("🛒 Тест: Пятёрочка 1 850 ₽ (Сбер)") }
                  OutlinedButton(onClick = { onSim(3400.0, "АЗС Газпромнефть", "Газпромбанк") }, modifier = Modifier.fillMaxWidth()) { Text("🚗 Тест: АЗС Газпромнефть 3 400 ₽ (ГПБ)") }
                  OutlinedButton(onClick = { onSim(2190.0, "Ozon", "Т-Банк") }, modifier = Modifier.fillMaxWidth()) { Text("📦 Тест: Ozon 2 190 ₽ (Т-Банк)") }
              }
          }

          fun isNotificationServiceEnabled(context: Context): Boolean {
              val flat = Settings.Secure.getString(context.contentResolver, "enabled_notification_listeners") ?: return false
              return flat.contains(context.packageName)
          }

          fun formatRub(amount: Double): String {
              val nf = NumberFormat.getNumberInstance(Locale("ru", "RU")).apply { maximumFractionDigits = if (amount % 1.0 == 0.0) 0 else 2 }
              return "${nf.format(amount)} ₽"
          }
          EOF

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Сборка Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Ohrana-Denyak-APK
          path: app/build/outputs/apk/debug/app-debug.apk
