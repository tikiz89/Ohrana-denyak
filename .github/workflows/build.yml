                          NavigationBarItem(selected = selectedTab == 1, onClick = { selectedTab = 1 }, icon = { Icon(Icons.Default.ReceiptLong, null) }, label = { Text("Операции") })
                          NavigationBarItem(selected = selectedTab == 2, onClick = { selectedTab = 2 }, icon = { Icon(Icons.Default.Security, null) }, label = { Text("Авточтение") })
                      }
                  },
