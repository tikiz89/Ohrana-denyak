          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.NumberFormat
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : ComponentActivity() {
              private lateinit var dbHelper: ExpenseDbHelper
              private var refreshTrigger by mutableIntStateOf(0)
              private val expenseReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) { refreshTrigger++ }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  dbHelper = ExpenseDbHelper(this)
                  val filter = IntentFilter(BankNotificationService.ACTION_EXPENSE_ADDED)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(expenseReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(expenseReceiver, filter)
                  }
                  setContent {
                      val darkScheme = darkColorScheme(primary = Color(0xFF00E676), secondary = Color(0xFF29B6F6), background = Color(0xFF0F1115), surface = Color(0xFF1A1D24), onPrimary = Color.Black)
                      MaterialTheme(colorScheme = darkScheme) {
                          MainScreen(dbHelper = dbHelper, refreshKey = refreshTrigger, onForceRefresh = { refreshTrigger++ })
                      }
                  }
              }
              override fun onResume() { super.onResume(); refreshTrigger++ }
              override fun onDestroy() { super.onDestroy(); unregisterReceiver(expenseReceiver) }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainScreen(dbHelper: ExpenseDbHelper, refreshKey: Int, onForceRefresh: () -> Unit) {
              val context = LocalContext.current
              var selectedTab by remember { mutableIntStateOf(0) }
              val cal = remember { Calendar.getInstance() }
              var currentYear by remember { mutableIntStateOf(cal.get(Calendar.YEAR)) }
              var currentMonth by remember { mutableIntStateOf(cal.get(Calendar.MONTH)) }

              val expenses = remember(refreshKey, currentYear, currentMonth) { dbHelper.getExpensesForMonth(currentYear, currentMonth) }
              val budget = remember(refreshKey) { dbHelper.getMonthlyBudget() }
              val isListenerEnabled = remember(refreshKey) { isNotificationServiceEnabled(context) }

              var showAddDialog by remember { mutableStateOf(false) }
              var showBudgetDialog by remember { mutableStateOf(false) }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("🛡️ Охрана деняк", fontWeight = FontWeight.Bold, fontSize = 20.sp) },
                          actions = { IconButton(onClick = { showBudgetDialog = true }) { Icon(Icons.Default.AccountBalanceWallet, contentDescription = null, tint = Color.White) } },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0F1115), titleContentColor = Color.White)
                      )
                  },
                  bottomBar = {
                      NavigationBar(containerColor = Color(0xFF161920)) {
