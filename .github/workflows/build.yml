              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ru.zheka.ohranadenyak"
              compileSdk = 34

              defaultConfig {
                  applicationId = "ru.zheka.ohranadenyak"
                  minSdk = 26
                  targetSdk = 34
