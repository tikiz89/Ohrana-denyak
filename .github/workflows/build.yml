          cat << 'EOF' > app/src/main/java/ru/zheka/ohranadenyak/ExpenseDbHelper.kt
          package ru.zheka.ohranadenyak

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import java.util.Calendar

          data class ExpenseItem(
              val id: Long,
              val amount: Double,
              val merchant: String,
              val category: String,
              val bank: String,
              val timestamp: Long,
              val isIncome: Boolean = false
          )

          enum class ZenCategory(val title: String, val colorHex: Long, val emoji: String) {
              GROCERIES("Продукты", 0xFF4CAF50, "🛒"),
              AUTO("Авто и АЗС", 0xFFFF9800, "🚗"),
              CAFE("Кафе и Доставка", 0xFFE91E63, "🍔"),
              MARKETPLACES("Маркетплейсы", 0xFF9C27B0, "📦"),
              HOME("Дом и ЖКХ", 0xFF00BCD4, "🏠"),
              GAMING("Игры и Подписки", 0xFF3F51B5, "🎮"),
              HEALTH("Аптека и Здоровье", 0xFFF44336, "💊"),
              OTHER("Прочее", 0xFF607D8B, "💳");

              companion object {
                  fun fromTitle(title: String): ZenCategory = values().find { it.title == title } ?: OTHER

                  fun detectCategory(merchant: String, rawText: String): ZenCategory {
                      val text = "$merchant $rawText".lowercase()
                      return when {
                          text.contains("пятерочка") || text.contains("пятёрочка") || text.contains("pyaterochka") ||
                          text.contains("магнит") || text.contains("magnit") || text.contains("монетка") ||
                          text.contains("перекресток") || text.contains("лента") || text.contains("кб") ||
                          text.contains("красное") || text.contains("krasnoe") || text.contains("ашан") ||
                          text.contains("вкусвилл") || text.contains("супермаркет") || text.contains("продукты") -> GROCERIES

                          text.contains("азс") || text.contains("газпромнефть") || text.contains("лукойл") ||
                          text.contains("роснефть") || text.contains("azs") || text.contains("авто") ||
                          text.contains("мойка") || text.contains("шиномонтаж") || text.contains("парковка") ||
                          text.contains("штраф") || text.contains("запчаст") -> AUTO

                          text.contains("кафе") || text.contains("ресторан") || text.contains("додо") ||
                          text.contains("dodo") || text.contains("вкусно и точка") || text.contains("burger") ||
                          text.contains("kfc") || text.contains("rostics") || text.contains("кофе") ||
                          text.contains("coffee") || text.contains("шаурма") || text.contains("пекарня") ||
                          text.contains("суши") || text.contains("пицца") -> CAFE

                          text.contains("ozon") || text.contains("озон") || text.contains("wildberries") ||
                          text.contains("вайлдберриз") || text.contains("wb") || text.contains("ymarket") ||
                          text.contains("яндекс маркет") || text.contains("aliexpress") || text.contains("dns") ||
                          text.contains("днс") || text.contains("м.видео") || text.contains("эльдорадо") -> MARKETPLACES

                          text.contains("жкх") || text.contains("ростелеком") || text.contains("интернет") ||
                          text.contains("мтс") || text.contains("мегафон") || text.contains("билайн") ||
                          text.contains("tele2") || text.contains("теле2") || text.contains("yota") ||
                          text.contains("коммунал") || text.contains("энерго") -> HOME

                          text.contains("steam") || text.contains("playstation") || text.contains("яндекс плюс") ||
                          text.contains("yandex plus") || text.contains("кинопоиск") || text.contains("игры") -> GAMING

                          text.contains("аптека") || text.contains("apteka") || text.contains("клиника") ||
                          text.contains("здравсити") || text.contains("еаптека") || text.contains("стоматолог") -> HEALTH

                          else -> OTHER
                      }
                  }
              }
          }

          class ExpenseDbHelper(context: Context) : SQLiteOpenHelper(context, "ohrana_denyak.db", null, 1) {
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE expenses (id INTEGER PRIMARY KEY AUTOINCREMENT, amount REAL NOT NULL, merchant TEXT NOT NULL, category TEXT NOT NULL, bank TEXT NOT NULL, timestamp INTEGER NOT NULL, is_income INTEGER DEFAULT 0)")
                  db.execSQL("CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT NOT NULL)")
                  val cv = ContentValues().apply { put("key", "monthly_budget"); put("value", "80000") }
                  db.insert("settings", null, cv)
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  db.execSQL("DROP TABLE IF EXISTS expenses")
                  db.execSQL("DROP TABLE IF EXISTS settings")
                  onCreate(db)
              }

              fun insertExpense(amount: Double, merchant: String, category: String, bank: String, timestamp: Long = System.currentTimeMillis(), isIncome: Boolean = false): Long {
                  val db = writableDatabase
                  val ninetySecAgo = timestamp - 90_000
                  val cursor = db.rawQuery("SELECT id FROM expenses WHERE ABS(amount - ?) < 0.01 AND timestamp > ? AND is_income = ?", arrayOf(amount.toString(), ninetySecAgo.toString(), if (isIncome) "1" else "0"))
                  val exists = cursor.moveToFirst()
                  cursor.close()
                  if (exists) return -1L

                  val values = ContentValues().apply {
                      put("amount", amount); put("merchant", merchant); put("category", category)
                      put("bank", bank); put("timestamp", timestamp); put("is_income", if (isIncome) 1 else 0)
                  }
                  return db.insert("expenses", null, values)
              }

              fun deleteExpense(id: Long) { writableDatabase.delete("expenses", "id = ?", arrayOf(id.toString())) }

              fun getExpensesForMonth(year: Int, monthZeroBased: Int): List<ExpenseItem> {
                  val cal = Calendar.getInstance()
                  cal.set(year, monthZeroBased, 1, 0, 0, 0)
                  cal.set(Calendar.MILLISECOND, 0)
                  val startMs = cal.timeInMillis
                  cal.add(Calendar.MONTH, 1)
                  val endMs = cal.timeInMillis

                  val list = mutableListOf<ExpenseItem>()
                  val cursor = readableDatabase.rawQuery("SELECT id, amount, merchant, category, bank, timestamp, is_income FROM expenses WHERE timestamp >= ? AND timestamp < ? ORDER BY timestamp DESC", arrayOf(startMs.toString(), endMs.toString()))
                  while (cursor.moveToNext()) {
                      list.add(ExpenseItem(cursor.getLong(0), cursor.getDouble(1), cursor.getString(2), cursor.getString(3), cursor.getString(4), cursor.getLong(5), cursor.getInt(6) == 1))
                  }
                  cursor.close()
                  return list
              }

              fun getMonthlyBudget(): Double {
                  val cursor = readableDatabase.rawQuery("SELECT value FROM settings WHERE key = 'monthly_budget'", null)
                  var budget = 80000.0
                  if (cursor.moveToFirst()) budget = cursor.getString(0).toDoubleOrNull() ?: 80000.0
                  cursor.close()
                  return budget
              }

              fun setMonthlyBudget(amount: Double) {
                  val cv = ContentValues().apply { put("key", "monthly_budget"); put("value", amount.toString()) }
                  writableDatabase.insertWithOnConflict("settings", null, cv, SQLiteDatabase.CONFLICT_REPLACE)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/ru/zheka/ohranadenyak/BankNotificationService.kt
          package ru.zheka.ohranadenyak

          import android.app.Notification
          import android.content.Intent
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class BankNotificationService : NotificationListenerService() {
              companion object {
                  const val ACTION_EXPENSE_ADDED = "ru.zheka.ohranadenyak.EXPENSE_ADDED"
                  val SUPPORTED_BANKS = mapOf(
                      "ru.sberbankmobile" to "Сбербанк",
                      "com.idamob.tinkoff.android" to "Т-Банк",
                      "ru.tinkoff.mb" to "Т-Банк",
                      "ru.vtb24.mobilebanking.android" to "ВТБ",
                      "ru.gazprombank.android.mobilebank.app" to "Газпромбанк",
                      "ru.alfabank.mobile.android" to "Альфа-Банк",
                      "com.openbank" to "Открытие",
                      "ru.raiffeisennews" to "Райффайзен",
                      "ru.yoo.money" to "ЮMoney",
                      "com.Wildberries.ru" to "WB Кошелек",
                      "ru.ozon.app.android" to "Ozon Банк"
                  )
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn == null) return
                  val pkg = sbn.packageName ?: return
                  val bankName = SUPPORTED_BANKS[pkg] ?: if (pkg == packageName) "Тест-Банк" else return
                  val extras = sbn.notification?.extras ?: return
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val bigText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString() ?: text
                  val fullContent = "$title $bigText".trim()
                  if (fullContent.isEmpty()) return
                  parseAndSave(fullContent, title, bigText, bankName)
              }

              private fun parseAndSave(fullText: String, title: String, body: String, bankName: String) {
                  val lower = fullText.lowercase()
                  val ignoreMarkers = listOf("код подтверждения", "никому не сообщайте", "код:", "пароль", "вход в приложение", "запрос на перевод", "недостаточно средств", "отказ", "отклонено", "перевод между своими")
                  if (ignoreMarkers.any { lower.contains(it) }) return

                  val expenseMarkers = listOf("покупка", "оплата", "списание", "платеж", "платёж", "перевод", "снятие", "потрачено", "минус", "успешно")
                  val incomeMarkers = listOf("зачисление", "пополнение", "перевод от", "возврат", "зарплата", "кэшбэк")

                  val isIncome = incomeMarkers.any { lower.contains(it) } && !lower.contains("покупка")
                  val isExpense = expenseMarkers.any { lower.contains(it) }
                  if (!isExpense && !isIncome) return

                  val cleanedForAmount = fullText.replace(Regex("(?:баланс|доступно|остаток)[^0-9]*([0-9\\s.,]+)\\s*(?:₽|р|руб|rub)", RegexOption.IGNORE_CASE), "")
                  val amountRegex = Regex("([0-9][0-9\\s\\u00A0]*(?:[.,][0-9]{1,2})?)\\s*(?:₽|р\\.|руб|rub|р\\b)", RegexOption.IGNORE_CASE)
                  val match = amountRegex.find(cleanedForAmount) ?: return
                  val rawAmountStr = match.groupValues[1].replace("\\s".toRegex(), "").replace("\u00A0", "").replace(",", ".")
                  val amount = rawAmountStr.toDoubleOrNull() ?: return
                  if (amount <= 0.0) return

                  val merchant = extractMerchant(title, body, bankName)
                  val category = if (isIncome) "Доход" else ZenCategory.detectCategory(merchant, fullText).title
                  val db = ExpenseDbHelper(applicationContext)
                  val insertedId = db.insertExpense(amount, merchant, category, bankName, isIncome = isIncome)
                  if (insertedId != -1L) sendBroadcast(Intent(ACTION_EXPENSE_ADDED))
              }

              private fun extractMerchant(title: String, body: String, bankName: String): String {
                  if (title.isNotBlank() && !title.equals(bankName, ignoreCase = true) && !title.lowercase().contains("сбер") && !title.lowercase().contains("покупка") && !title.lowercase().contains("списание")) {
                      return title.trim()
                  }
                  val merchantRegex = Regex("(?:в магазине|в|кому:)\\s+([А-Яа-яA-Za-z0-9_\\-\\s.\"]{2,25}?)(?:\\.|,|\\s+Баланс|\\s+Доступно|\\s+Карта|$)", RegexOption.IGNORE_CASE)
                  val mMatch = merchantRegex.find(body)
                  if (mMatch != null) {
                      val found = mMatch.groupValues[1].trim()
                      if (found.length >= 2) return found
                  }
                  return body.take(28).trim().ifEmpty { "Операция по карте" }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/ru/zheka/ohranadenyak/MainActivity.kt
          package ru.zheka.ohranadenyak

          import android.content.*
          import android.os.Build
